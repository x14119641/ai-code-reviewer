[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["B008"]

"benchmarks/**/*.py" = [
    "B006",
    "I001",
    "SIM103",
    "UP031",
    "BLE001",
    "S110",
    "E722",
]

"diff_benchmarks/**/*.py" = [
    "B006",
    "SIM115",
    "BLE001",
    "S110",
    "E722",
]

"diff_benchmarks_generalization/**/*.py" = [
    "B006",
    "SIM115",
    "BLE001",
    "S110",
    "E722",
]